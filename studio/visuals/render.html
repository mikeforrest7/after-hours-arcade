<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AFTER HOURS — Arcade Studio · Visual Concept Scene</title>
<!--
  Deterministic view/capture interface (see visuals/MANIFEST.md for full docs).

  Query param:  render.html?view=hero|room|trackball|shooter|mounted|exploded
  Global API:   window.setView(name)   — switches camera + scene state, re-renders once
                window.ARCADE_VIEWS    — ['hero','room','trackball','shooter','mounted','exploded']
                window.renderReady     — true once at least one frame (textures + assets) has rendered
                window.ARCADE_RENDERER — 'webgl' or '2d-fallback' (src/main.js auto-detects WebGL)

  No continuous animation: each view is a single static deterministic render.
  No network access is required to view this page — Three.js is vendored under visuals/vendor/
  and all screen/material art is generated procedurally on an HTML canvas at load time.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #121014; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; }
  canvas#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(to bottom, rgba(10,10,12,0.82), rgba(10,10,12,0));
    pointer-events: none;
  }
  .toolbar * { pointer-events: auto; }
  .brand { color: #f1e6d8; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; margin-right: 10px; white-space: nowrap; }
  .brand small { display: block; font-weight: 400; color: #9fb0ac; font-size: 10px; letter-spacing: 0.08em; }

  .views { display: flex; gap: 6px; flex-wrap: wrap; }
  button[data-view] {
    appearance: none; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(24,24,27,0.72); color: #dfe7e4;
    font: 600 12px "Segoe UI", Arial, sans-serif; letter-spacing: 0.03em;
    padding: 8px 13px; border-radius: 7px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  button[data-view]:hover { background: rgba(43,217,199,0.18); border-color: rgba(43,217,199,0.5); }
  button[data-view].active { background: #2bd9c7; border-color: #2bd9c7; color: #0c1312; }

  #viewLabel {
    margin-left: auto; color: #cfe9e3; font-size: 12px; text-align: right;
    max-width: 320px; opacity: 0.9;
  }

  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #eee; background: #121014; padding: 24px; text-align: center; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="toolbar">
    <div class="brand">AFTER HOURS<small>ARCADE STUDIO · VISUAL CONCEPT SCENE</small></div>
    <div class="views" role="group" aria-label="Deterministic camera views">
      <button data-view="hero" title="Hero three-quarter, both stations">Hero</button>
      <button data-view="room" title="Full illustrative room context">Room</button>
      <button data-view="trackball" title="Station A control-deck detail">Trackball</button>
      <button data-view="shooter" title="Station B, handheld holster guns">Shooter</button>
      <button data-view="mounted" title="Station B, mounted-gimbal alternative">Mounted</button>
      <button data-view="exploded" title="Station A panel breakdown">Exploded</button>
    </div>
    <div id="viewLabel"></div>
  </div>

  <noscript>This concept scene needs JavaScript (Three.js, vendored locally) to render.</noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
